name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # El repositorio solo trae lib/, test/ y pubspec.yaml: aquí se genera la carpeta android/.
      - name: Generar plataforma Android si no existe
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org com.roomies --project-name roomies
            # Firebase requiere minSdk 23
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle* || true
          fi

      - run: flutter pub get
      - run: flutter test

      - name: Compilar APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: roomies-apk
          path: build/app/outputs/flutter-apk/app-release.apk
